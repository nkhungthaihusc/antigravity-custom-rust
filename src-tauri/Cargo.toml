[package]
name = "antigravity-custom-launcher"
version = "0.5.0"
description = "Antigravity Custom Launcher (Rust + Tauri v2)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agc-core = { path = "../crates/agc-core" }

[dev-dependencies]
tempfile = "3.10"
