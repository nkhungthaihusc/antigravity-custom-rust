[package]
name = "agc-core"
version = "0.5.0"
edition = "2021"

[lib]
name = "agc_core"
path = "src/lib.rs"

[[bin]]
name = "agc"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scrypt = "0.11"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
directories = "5.0"
chrono = "0.4"
subtle = "2.5"

[dev-dependencies]
tempfile = "3.10"
